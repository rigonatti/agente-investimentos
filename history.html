<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Histórico — Agente de Investimentos</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<script src="theme.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-2: #1e2739;
    --border: #2a3548;
    --text: #e8ecf4;
    --muted: #8b96ab;
    --accent: #4f8cff;
    --accent-2: #2fd08a;
    --danger: #ff5c6c;
    --warn: #f5b84f;
    --radius: 14px;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --panel-2: #eef1f8;
    --border: #dbe1ec;
    --text: #1a2233;
    --muted: #667085;
    --accent: #3b6fe0;
    --accent-2: #1f9d6c;
    --danger: #d8384a;
    --warn: #b9791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; gap: 8px; }
  header h1 { font-size: 1.5rem; margin: 0; }
  .header-actions { display: flex; gap: 8px; }
  a.back, .icon-btn, button.text-btn {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    background: var(--panel);
    cursor: pointer;
    font-family: inherit;
  }
  .icon-btn { font-size: 1rem; padding: 8px 12px; }
  a.back:hover, .icon-btn:hover, button.text-btn:hover { border-color: var(--accent); color: var(--text); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .empty-state a { color: var(--accent); }

  .list-actions { display: flex; justify-content: flex-end; margin-bottom: 16px; }

  .history-list { display: flex; flex-direction: column; gap: 12px; }
  .history-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    transition: border-color 0.15s ease;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-item .main { flex: 1; min-width: 0; }
  .history-item .meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
    font-size: 0.78rem;
  }
  .badge {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--muted);
  }
  .history-item .question {
    margin: 0;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item .date {
    color: var(--muted);
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--danger); }

  #detail { display: none; }
  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .detail-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  section h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .question-box {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 14px 16px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .parecer-box {
    background: var(--panel-2);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 18px;
    line-height: 1.6;
  }
  .parecer-box p { margin: 0 0 12px; }
  .parecer-box p:last-child { margin-bottom: 0; }
  .verdict {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
  }
  .verdict-yes { background: rgba(47, 208, 138, 0.18); color: var(--accent-2); }
  .verdict-no { background: rgba(255, 92, 108, 0.18); color: var(--danger); }
  .verdict-maybe { background: rgba(245, 184, 79, 0.18); color: var(--warn); }
  .carteira-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .carteira-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .carteira-item .pct { font-size: 1.6rem; font-weight: 700; color: var(--accent-2); }
  .carteira-item .ativo { margin-top: 6px; color: var(--muted); font-size: 0.85rem; }
  .carteira-item .valor { margin-top: 4px; color: var(--text); font-size: 0.85rem; font-weight: 600; }

  .report-macro {
    background: var(--panel-2);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 24px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .report-macro .destaque { color: var(--accent); font-weight: 600; margin-top: 6px; }
  .pontos-lista { margin: 0; padding-left: 20px; color: var(--text); line-height: 1.7; }
  .pontos-lista li { margin-bottom: 6px; }
  .report-logo { width: 28px; height: 28px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Histórico de análises</h1>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" type="button" title="Alternar tema" aria-label="Alternar tema" onclick="toggleTheme()">☀️</button>
      <a class="back" href="options.html">⚙️ Opções</a>
      <a class="back" href="index.html">← Voltar</a>
    </div>
  </header>

  <div id="listView">
    <div class="list-actions">
      <button class="text-btn" id="clearAllBtn">Limpar histórico</button>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">
      Nenhuma análise realizada ainda.<br />
      <a href="index.html">Fazer a primeira análise →</a>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div id="detail">
    <div class="detail-header">
      <button class="text-btn" id="backToListBtn">← Voltar ao histórico</button>
    </div>
    <div id="reportCard">
      <div class="detail-meta" id="detailMeta"></div>
      <div class="question-box" id="detailQuestion"></div>
      <div class="report-macro" id="detailMacro" style="display:none;"></div>
      <section>
        <h2>Parecer</h2>
        <div class="parecer-box" id="detailParecer"></div>
      </section>
      <section>
        <h2>Carteira sugerida</h2>
        <div class="carteira-grid" id="detailCarteira"></div>
      </section>
      <div id="detailPontosAtencao"></div>
    </div>
    <div class="list-actions">
      <button class="text-btn" id="downloadImageBtn">📷 Baixar imagem</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="format.js"></script>
<script>
  const listView = document.getElementById('listView');
  const detailView = document.getElementById('detail');
  const historyList = document.getElementById('historyList');
  const emptyState = document.getElementById('emptyState');
  const detailMeta = document.getElementById('detailMeta');
  const detailQuestion = document.getElementById('detailQuestion');
  const detailMacro = document.getElementById('detailMacro');
  const detailParecer = document.getElementById('detailParecer');
  const detailCarteira = document.getElementById('detailCarteira');
  const detailPontosAtencao = document.getElementById('detailPontosAtencao');
  const reportCard = document.getElementById('reportCard');
  const downloadImageBtn = document.getElementById('downloadImageBtn');

  function renderList() {
    const historico = AgenteFormat.getHistory();
    historyList.innerHTML = '';

    if (!historico.length) {
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    historico.forEach((entry) => {
      const item = document.createElement('div');
      item.className = 'history-item';

      const main = document.createElement('div');
      main.className = 'main';

      const meta = document.createElement('div');
      meta.className = 'meta';
      const perfilLabel = AgenteFormat.PERFIL_LABELS[entry.profile] || entry.profile;
      meta.innerHTML = `<span class="badge">${perfilLabel}</span>`;
      if (entry.objetivo) {
        meta.innerHTML += `<span class="badge">${AgenteFormat.OBJETIVO_LABELS[entry.objetivo] || entry.objetivo}</span>`;
      }

      const question = document.createElement('p');
      question.className = 'question';
      question.textContent = entry.question;

      main.appendChild(meta);
      main.appendChild(question);

      const date = document.createElement('div');
      date.className = 'date';
      date.textContent = AgenteFormat.formatDate(entry.date);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.title = 'Excluir';
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        AgenteFormat.deleteHistoryEntry(entry.id);
        renderList();
      });

      item.appendChild(main);
      item.appendChild(date);
      item.appendChild(deleteBtn);

      item.addEventListener('click', () => showDetail(entry));
      historyList.appendChild(item);
    });
  }

  function showDetail(entry) {
    const perfilLabel = AgenteFormat.PERFIL_LABELS[entry.profile] || entry.profile;
    detailMeta.innerHTML = `
      <span class="badge">${perfilLabel}</span>
      ${entry.objetivo ? `<span class="badge">${AgenteFormat.OBJETIVO_LABELS[entry.objetivo] || entry.objetivo}</span>` : ''}
      ${entry.model ? `<span class="badge">Modelo: ${entry.model}</span>` : ''}
      <span class="badge">${AgenteFormat.formatDate(entry.date)}</span>
    `;
    detailQuestion.textContent = entry.question;

    if (entry.resumoExecutivo) {
      const r = entry.resumoExecutivo;
      detailMacro.innerHTML = `
        ${r.mesReferencia ? `<strong>${AgenteFormat.escapeHtml(r.mesReferencia)}</strong><br>` : ''}
        ${r.cenarioMacro ? AgenteFormat.escapeHtml(r.cenarioMacro) : ''}
        ${r.destaque ? `<div class="destaque">${AgenteFormat.escapeHtml(r.destaque)}</div>` : ''}
      `;
      detailMacro.style.display = 'block';
    } else {
      detailMacro.style.display = 'none';
    }

    detailParecer.innerHTML = AgenteFormat.renderParecerHtml(entry.parecer);
    detailCarteira.innerHTML = AgenteFormat.renderCarteiraHtml(entry.carteira, entry.valorDisponivel);

    const pontosHtml = AgenteFormat.renderPontosAtencaoHtml(entry.pontosAtencao);
    detailPontosAtencao.innerHTML = pontosHtml ? `<section>${pontosHtml}</section>` : '';

    listView.style.display = 'none';
    detailView.style.display = 'block';
    window.scrollTo(0, 0);
  }

  function showList() {
    detailView.style.display = 'none';
    listView.style.display = 'block';
  }

  document.getElementById('backToListBtn').addEventListener('click', showList);

  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!AgenteFormat.getHistory().length) return;
    if (confirm('Tem certeza que deseja apagar todo o histórico de análises?')) {
      AgenteFormat.clearHistory();
      renderList();
    }
  });

  downloadImageBtn.addEventListener('click', async () => {
    downloadImageBtn.disabled = true;
    downloadImageBtn.textContent = 'Gerando imagem...';
    try {
      const bg = getComputedStyle(document.body).backgroundColor;
      const canvas = await html2canvas(reportCard, { backgroundColor: bg, scale: 2 });
      const link = document.createElement('a');
      link.download = `analise-investimento-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      alert('Não foi possível gerar a imagem: ' + err.message);
    } finally {
      downloadImageBtn.disabled = false;
      downloadImageBtn.textContent = '📷 Baixar imagem';
    }
  });

  renderList();
  updateThemeToggleIcon();
</script>
</body>
</html>
