<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — Agente de Investimentos</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<script src="theme.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-2: #1e2739;
    --border: #2a3548;
    --text: #e8ecf4;
    --muted: #8b96ab;
    --accent: #4f8cff;
    --accent-2: #2fd08a;
    --danger: #ff5c6c;
    --radius: 14px;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --panel-2: #eef1f8;
    --border: #dbe1ec;
    --text: #1a2233;
    --muted: #667085;
    --accent: #3b6fe0;
    --accent-2: #1f9d6c;
    --danger: #d8384a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo img { width: 48px; height: 48px; }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.subtitle { text-align: center; color: var(--muted); margin: 0 0 28px; font-size: 0.9rem; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; }
  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: white;
    transition: opacity 0.15s ease;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button:hover:not(:disabled) { opacity: 0.85; }
  #error {
    display: none;
    background: rgba(255, 92, 108, 0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="favicon.svg" alt="" /></div>
    <h1>Agente de Investimentos</h1>
    <p class="subtitle">Faça login para continuar</p>

    <div id="error"></div>

    <form id="loginForm">
      <label for="username">Usuário</label>
      <input type="text" id="username" autocomplete="username" required />

      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required />

      <button type="submit" id="submitBtn">Entrar</button>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  fetch('/api/me').then((res) => {
    if (res.ok) window.location.href = '/index.html';
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Não foi possível entrar.');
      window.location.href = '/index.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
