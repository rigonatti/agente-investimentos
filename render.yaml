services:
  - type: web
    name: agente-investimentos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTH_USERS
        value: rigonatti,taniamielcke
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: ADMIN_USERS
        value: rigonatti
      - key: NODE_VERSION
        value: 20
